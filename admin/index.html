<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DA’POR Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--black:#070707;--ink:#11100e;--ivory:#f1eadf;--paper:#f8f3e9;--card:#fbf8f2;--gold:#bd8a2a;--gold2:#e1bd68;--goldd:#87611c;--line:rgba(20,18,14,.13);--muted:#6f685d;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",Arial,sans-serif;--green:#2f7a4b;--red:#a8322a;--blue:#2c5d8a;--amber:#b0761a}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:14px;font-variant-numeric:tabular-nums lining-nums}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--black);color:#d8d3c9;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid #1f1a12}
.side .logo{display:flex;align-items:center;gap:12px;padding:22px 22px 20px;border-bottom:1px solid #1d1912}
.side .logo img{width:54px;height:54px;object-fit:contain}
.side .logo b{font-family:var(--serif);font-size:24px;color:#fff;letter-spacing:.02em;display:block;line-height:1}
.side .logo small{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2)}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#bdb6aa;padding:11px 14px;border-radius:10px;text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;transition:.2s}
.nav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;flex:none}
.nav button:hover{background:#15120d;color:#fff}
.nav button.active{background:linear-gradient(110deg,#9d6e1f,#d1a34c);color:#0b0906}
.nav .pill{margin-left:auto;background:#a8322a;font-variant-numeric:tabular-nums;color:#fff;border-radius:999px;font-size:10px;padding:2px 7px;letter-spacing:0}
.nav button.active .pill{background:#0b0906;color:var(--gold2)}
.side .foot{padding:16px 22px;border-top:1px solid #1d1912;font-size:11px;color:#8b8478}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fbf6f;margin-right:8px;box-shadow:0 0 0 0 rgba(63,191,111,.6);animation:pulse 1.8s infinite}
.live-dot.off{background:#777;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,191,111,.55)}70%{box-shadow:0 0 0 9px rgba(63,191,111,0)}100%{box-shadow:0 0 0 0 rgba(63,191,111,0)}}
/* main */
main{min-width:0}
.top{height:74px;display:flex;align-items:center;gap:16px;padding:0 34px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.toast .live-dot{vertical-align:middle}
.top h1{font-family:var(--serif);font-size:32px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:-.01em}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;width:280px}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px}
.search svg{width:16px;stroke:#888;fill:none;stroke-width:2}
.menu-btn{display:none;border:0;background:transparent;font-size:24px}
.content{padding:30px 34px 60px}
.btn{height:40px;padding:0 18px;border:1px solid var(--ink);background:transparent;border-radius:2px;text-transform:uppercase;font-size:10.5px;font-weight:700;letter-spacing:.12em;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:.2s}
.btn:hover{background:var(--ink);color:#fff}
.btn.gold{border:0;background:linear-gradient(110deg,#9f6d17,#d6a948,#aa771f);color:#090909}
.btn.gold:hover{filter:brightness(1.1);color:#090909}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:#2a251c}
.btn.sm{height:32px;padding:0 12px;font-size:9.5px}
.btn.danger{border-color:var(--red);color:var(--red)}.btn.danger:hover{background:var(--red);color:#fff}
.btn.ghost{border-color:transparent}.btn.ghost:hover{background:rgba(0,0,0,.06);color:inherit}
.eyebrow{color:var(--goldd);text-transform:uppercase;letter-spacing:.2em;font-weight:700;font-size:10px;margin:0 0 6px}
h2.sec{font-family:var(--serif);font-size:30px;font-weight:600;margin:0;text-transform:uppercase}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel{background:var(--card);border:1px solid #d9d0c2;padding:22px}
.panel-h{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px;gap:12px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid #d9d0c2;padding:18px 20px;position:relative;overflow:hidden}
.kpi.dark{background:#0a0a09;color:#fff;border-color:#2c261c}
.kpi label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:700}
.kpi.dark label{color:var(--gold2)}
.kpi .v{font-family:var(--sans);font-size:26px;font-weight:700;line-height:1.1;margin-top:10px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11px;color:var(--muted);margin-top:4px}.kpi.dark .d{color:#a39c90}
.kpi .d b{color:var(--green)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:18px}
/* table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#f3ece0}
tr.flash td{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:#f2d9a3}100%{background:transparent}}
.tbl-wrap{overflow-x:auto}
.pimg{width:46px;height:56px;object-fit:cover;background:#0b0b0a;display:block}
.tname{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.1}
.tsub{font-size:11px;color:var(--muted)}
/* status chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-new{background:#fbeac4;color:#8a5a0c}.c-processing{background:#dde8f3;color:var(--blue)}.c-shipped{background:#e6e0f2;color:#5b3f8f}.c-delivered{background:#dcefe2;color:var(--green)}.c-cancelled{background:#f4dcd9;color:var(--red)}
.c-active{background:#dcefe2;color:var(--green)}.c-soon{background:#fbeac4;color:#8a5a0c}.c-draft{background:#e6e2db;color:#5f594f}.c-oos{background:#f4dcd9;color:var(--red)}.c-low{background:#fbe4cc;color:#9a5410}.c-sale{background:#111;color:var(--gold2)}.c-expired{background:#e6e2db;color:#5f594f}
/* chart */
.chart svg{width:100%;height:220px;display:block}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted)}
/* product cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pcard{background:var(--paper);border:1px solid #d5ccbe;position:relative;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.pcard:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(35,28,18,.12)}
.pcard .im{aspect-ratio:4/5;background:#0b0b0a;position:relative;overflow:hidden}
.pcard .im img{width:100%;height:100%;object-fit:cover;object-position:center top}
.pcard .im .badge{position:absolute;top:12px;left:12px;background:#b58834;color:#070707;padding:6px 10px;text-transform:uppercase;font-weight:800;font-size:9px;letter-spacing:.1em}
.pcard .im .st{position:absolute;top:12px;right:12px}
.pcard .im.oos img{filter:grayscale(1) brightness(.5)}
.pcard .im .oosbar{position:absolute;left:0;right:0;bottom:0;background:rgba(7,7,7,.85);color:#fff;text-align:center;text-transform:uppercase;font-size:10px;letter-spacing:.18em;padding:9px}
.pcard .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .kick{color:#8e6720;text-transform:uppercase;letter-spacing:.12em;font-size:9px;font-weight:700}
.pcard h3{font-family:var(--serif);font-size:22px;margin:0;line-height:1.05}
.price{font-weight:800}.price s{color:#9a9286;font-weight:500;margin-right:6px}.price .now{color:var(--red)}
.pcard .acts{display:flex;gap:6px;margin-top:10px}
.pcard .acts .btn{flex:1;justify-content:center}
.stockbar{height:4px;background:#e4dccf;margin-top:6px;position:relative}.stockbar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
/* toggle */
.tog{position:relative;width:40px;height:22px;flex:none;display:inline-block}
.tog input{opacity:0;width:0;height:0}
.tog span{position:absolute;inset:0;background:#cfc6b7;border-radius:999px;transition:.2s;cursor:pointer}
.tog span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.tog input:checked+span{background:var(--gold)}
.tog input:checked+span:before{transform:translateX(18px)}
/* forms */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.f{min-width:0}.f input,.f select,.f textarea{width:100%;min-width:0}
.f label{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:#4e483f}
.f input,.f select,.f textarea{height:42px;border:1px solid #d6cdbf;background:#fff;padding:0 12px;border-radius:2px;outline:0}
.f textarea{height:84px;padding:10px 12px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold)}
.f .hint{font-size:11px;color:var(--muted)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sizes div{border:1px solid #d6cdbf;background:#fff;padding:6px 8px;display:flex;align-items:center;gap:6px}
.sizes div b{font-size:11px;width:30px}.sizes div input{border:0;width:100%;height:28px;outline:0;text-align:right;padding:0}
.sizes div.zero{border-color:#e2a9a2;background:#fdf1ef}
/* modal / drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:.25s}
.ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:0;top:0;height:100%;width:min(620px,100%);background:var(--ivory);z-index:60;transform:translateX(100%);transition:.4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between;gap:12px;background:var(--paper)}
.dh h2{font-family:var(--serif);font-size:34px;margin:0;font-weight:600;line-height:1}
.db{padding:24px 28px;overflow:auto;flex:1}
.df{padding:16px 28px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--paper)}
.x{border:0;background:transparent;font-family:var(--serif);font-size:36px;line-height:.8}
.imgup{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.imgup img{width:96px;height:120px;object-fit:cover;background:#0b0b0a;border:1px solid #d6cdbf}
/* timeline */
.tl{display:flex;justify-content:space-between;position:relative;margin:8px 0 22px}
.tl:before{content:"";position:absolute;left:14px;right:14px;top:13px;height:2px;background:#d6cdbf}
.tl .s{position:relative;z-index:1;text-align:center;flex:1;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tl .s i{width:28px;height:28px;border-radius:50%;background:#e6dfd2;border:2px solid #d6cdbf;display:grid;place-items:center;margin:0 auto 6px;font-style:normal;font-size:12px}
.tl .s.done i{background:var(--gold);border-color:var(--gold);color:#0b0906}
.tl .s.done{color:var(--ink)}
.box{border:1px solid #d9d0c2;background:var(--card);padding:16px;margin-bottom:14px}
.box h4{margin:0 0 10px;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--goldd)}
.li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.li img{width:44px;height:54px;object-fit:cover;background:#0b0b0a}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}.sum.t{font-family:var(--sans);font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.log{font-size:12px;color:var(--muted);padding:4px 0}.log b{color:var(--ink);font-weight:600}
/* tabs filter */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:transparent;padding:8px 14px;border-radius:999px;text-transform:uppercase;font-size:10px;letter-spacing:.11em;font-weight:700}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button span{opacity:.6;margin-left:5px}
/* feed */
.feed{display:flex;flex-direction:column}
.feed .it{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.feed .it:last-child{border:0}
.feed .av{width:36px;height:36px;border-radius:50%;background:#0a0a09;color:var(--gold2);display:grid;place-items:center;font-family:var(--serif);font-size:16px;font-weight:700;flex:none}
.feed .it.fresh{animation:flash 2.4s ease-out}
.alert{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.alert:last-child{border:0}
/* discount cards */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.dcard{background:#0a0a09;color:#fff;padding:22px;position:relative;overflow:hidden;border:1px solid #2c261c}
.dcard.off{opacity:.55}
.dcard .code{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:.06em;color:var(--gold2)}
.dcard .val{font-size:13px;margin-top:2px}
.dcard .meta{font-size:11px;color:#a39c90;margin-top:12px;line-height:1.7}
.dcard .dacts{display:flex;gap:6px;margin-top:14px;align-items:center}
.dcard .dacts .btn{border-color:#4a4132;color:#e9e3d8}.dcard .dacts .btn:hover{background:#e9e3d8;color:#0a0a09}
.dcard:after{content:"%";position:absolute;right:-10px;bottom:-40px;font-family:var(--serif);font-size:160px;color:rgba(193,144,50,.08);font-weight:700}
.usage{height:3px;background:#2c261c;margin-top:8px}.usage i{display:block;height:100%;background:var(--gold)}
/* storefront preview */
.preview{background:#f1eadf;border:1px solid #d5ccbe}
.pv-ann{height:30px;background:#000;color:#d9bd83;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.pv-head{height:74px;background:#070707;display:flex;align-items:center;justify-content:center}
.pv-head img{height:60px}
.pv-body{padding:40px 4vw}
.pv-body h2{font-family:var(--serif);font-weight:600;font-size:54px;line-height:.9;margin:0 0 26px;text-transform:uppercase;letter-spacing:-.03em}
/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:100;display:flex;flex-direction:column;gap:10px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#0a0a09;color:#fff;padding:13px 18px;font-size:12.5px;border:1px solid #7e622a;display:block;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .35s ease-out;cursor:pointer}
.toast b{color:var(--gold2)}
@keyframes tin{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty b{display:block;font-family:var(--serif);font-size:28px;color:var(--ink);margin-bottom:6px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.muted{color:var(--muted)}
.sel{height:32px;border:1px solid #d6cdbf;background:#fff;font-size:11px;padding:0 8px;border-radius:2px}
.confirm{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);background:var(--ivory);z-index:80;padding:28px;width:min(420px,92vw);opacity:0;pointer-events:none;transition:.2s;border:1px solid #c9bda8}
.confirm.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.confirm h3{font-family:var(--serif);font-size:28px;margin:0 0 8px}
.demo-note{background:#0a0a09;color:#d9bd83;font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:7px}
textarea.export{width:100%;height:260px;font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid #d6cdbf;padding:10px;background:#fff}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;width:260px;z-index:70;transform:translateX(-100%);transition:.3s}.side.open{transform:none}.menu-btn{display:block}.top{padding:0 16px}.top h1{font-size:24px}.search{display:none}.content{padding:20px 16px 50px}.fr,.fr3{grid-template-columns:1fr}.sizes{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none}}
.web{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
.editor{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.acc{background:var(--card);border:1px solid #d9d0c2}
.acc.open{border-color:var(--gold)}
.acc-h{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.acc-h b{flex:1;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.acc-h i{font-style:normal;font-size:18px;width:14px;text-align:center;color:var(--goldd)}
.acc-b{padding:4px 16px 8px;border-top:1px solid var(--line)}
.acc-b .f{margin:12px 0}
.lrow{display:flex;gap:6px;margin-bottom:6px}.lrow input{flex:1;height:36px!important;font-size:13px}
.mini{border:1px solid #d6cdbf;background:#fff;width:36px;flex:none;font-size:16px}
.mini:hover{background:var(--red);color:#fff;border-color:var(--red)}
.subbox{border:1px solid #e0d8ca;background:#fff8;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.subbox input{height:36px;border:1px solid #d6cdbf;background:#fff;padding:0 10px;font-size:13px;width:100%;min-width:0}
.imgpick{display:flex;gap:10px;align-items:flex-start}
.imgpick>img{width:84px;height:84px;object-fit:cover;background:#0b0b0a;border:1px solid #d6cdbf;flex:none}
.imgpick .lib{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.imgpick .lib img{width:30px;height:30px;object-fit:cover;cursor:pointer;border:1px solid transparent;background:#0b0b0a}
.imgpick .lib img:hover{border-color:var(--gold);transform:scale(1.1)}
.site{container-type:inline-size;background:#f1eadf;border:1px solid #cfc4b2;overflow:hidden;box-shadow:0 18px 50px rgba(35,28,18,.12)}
.ws{position:relative;cursor:pointer}
.ws:hover{outline:2px solid var(--gold);outline-offset:-2px;z-index:2}
.ws-tag{position:absolute;right:8px;top:8px;z-index:5;background:var(--gold);color:#0b0906;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;opacity:0;transition:.15s;pointer-events:none}
.ws:hover .ws-tag{opacity:1}
.ws-hidden{border:1px dashed #b9ad97;color:#8a7f6c;font-size:10px;text-transform:uppercase;letter-spacing:.14em;text-align:center;padding:9px;margin:4px;background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(0,0,0,.03) 8px 16px)}
.w-eb{color:var(--gold2);text-transform:uppercase;letter-spacing:.2em;font-weight:700;font-size:max(8px,1.1cqw);margin:0 0 1.4cqw}.w-eb.d{color:#87611c}.w-eb.k{color:#1c160d}
.w-ann{height:max(24px,3.2cqw);background:#000;color:#d9bd83;display:flex;align-items:center;justify-content:center;gap:9cqw;font-size:max(7.5px,1cqw);letter-spacing:.18em;text-transform:uppercase}.w-ann span+span{opacity:.6}
.w-hd{background:#070707;height:max(54px,8cqw);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 4cqw}
.w-hd img{height:max(40px,6.4cqw);grid-column:1;grid-row:1;justify-self:start}
.w-hd nav{grid-column:2;grid-row:1;display:flex;gap:.6cqw;border:1px solid rgba(211,166,78,.26);background:#12100d;border-radius:999px;padding:.6cqw}
.w-hd nav a{color:#d8d3c9;font-size:max(7px,.95cqw);text-transform:uppercase;letter-spacing:.12em;padding:1cqw 1.8cqw;border-radius:999px}
.w-hd nav a.on{background:linear-gradient(110deg,#9d6e1f,#d1a34c);color:#090806}
.w-icons{grid-column:3;justify-self:end;color:#fff;font-size:max(10px,1.5cqw)}
.w-hero{position:relative;aspect-ratio:2048/939;background:#050505;color:#fff;overflow:hidden}
.w-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.w-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,3,3,.93) 0%,rgba(3,3,3,.68) 32%,rgba(3,3,3,.08) 61%,rgba(3,3,3,.12) 100%)}
.w-hero-c{position:absolute;left:6cqw;top:50%;transform:translateY(-45%);z-index:2;max-width:46cqw}
.w-hero h1{font-family:var(--serif);font-size:7.4cqw;font-weight:500;line-height:.84;letter-spacing:-.045em;text-transform:uppercase;margin:0 0 2cqw}
.w-hero p:not(.w-eb){font-size:max(9px,1.25cqw);line-height:1.7;color:#dfd9ce;max-width:34cqw;margin:0}
.w-btn{display:inline-flex;margin-top:2.4cqw;background:linear-gradient(110deg,#9f6d17,#d6a948,#aa771f);color:#090909;font-size:max(7.5px,.95cqw);font-weight:800;letter-spacing:.13em;text-transform:uppercase;padding:1.6cqw 2.6cqw}
.w-trust{background:#b48630;color:#0b0a08;display:flex;justify-content:center;align-items:center;gap:2.4cqw;padding:1.6cqw 2cqw;font-size:max(7.5px,.9cqw);font-weight:800;letter-spacing:.1em;text-transform:uppercase;flex-wrap:wrap;text-align:center}.w-trust b{font-size:.6cqw}
.w-sec{padding:7cqw 5cqw}
.w-head{display:flex;justify-content:space-between;align-items:end;gap:4cqw;margin-bottom:3.5cqw}
.w-head h2,.w-rev h2,.w-news h2{font-family:var(--serif);font-weight:600;font-size:5.2cqw;line-height:.9;margin:0;letter-spacing:-.035em;text-transform:uppercase}
.w-head>p{max-width:36cqw;font-size:max(9px,1.15cqw);line-height:1.7;color:#69645b;margin:0}
.w-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw}
.w-card{background:#f8f3e9;border:1px solid #d5ccbe}
.w-im{aspect-ratio:4/5;background:#0b0b0a;position:relative;overflow:hidden}
.w-im img{width:100%;height:100%;object-fit:cover;object-position:center top}
.w-im.oos img{filter:grayscale(1) brightness(.5)}
.w-im em{position:absolute;left:0;right:0;bottom:0;background:rgba(7,7,7,.85);color:#fff;font-style:normal;text-align:center;font-size:max(7px,.85cqw);letter-spacing:.18em;text-transform:uppercase;padding:1cqw}.w-im em.g{background:rgba(180,134,48,.92);color:#0b0906}
.w-badge{position:absolute;top:1.1cqw;left:1.1cqw;z-index:2;background:#b58834;color:#070707;padding:.6cqw .9cqw;font-style:normal;font-weight:800;font-size:max(6.5px,.75cqw);letter-spacing:.1em;text-transform:uppercase}.w-badge.dark{background:#111;color:var(--gold2)}
.w-inf{padding:1.5cqw}.w-inf small{color:#8e6720;text-transform:uppercase;letter-spacing:.12em;font-size:max(6.5px,.75cqw);font-weight:700}
.w-inf h3{font-family:var(--serif);font-size:max(13px,2cqw);margin:.5cqw 0 .3cqw;line-height:1.05}.w-inf p{font-size:max(8px,.95cqw);color:#777168;margin:0 0 1cqw}.w-inf .price{font-size:max(10px,1.2cqw)}
.w-stream{background:radial-gradient(circle at 50% 50%,#1b1610,#050505 70%);color:#fff;text-align:center;padding:9cqw 5cqw}
.w-stream h2{font-family:var(--serif);font-size:6.4cqw;line-height:.85;text-transform:uppercase;font-weight:600;letter-spacing:-.04em;margin:0 0 2.4cqw}
.w-stream span,.w-story span{font-size:max(8px,1cqw);text-transform:uppercase;letter-spacing:.12em;border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:.6cqw}
.w-story{display:grid;grid-template-columns:1.05fr .95fr;background:#070707;color:#fff}
.w-story img{width:100%;height:100%;min-height:44cqw;object-fit:cover;object-position:center top}
.w-story>div{padding:6cqw;align-self:center}
.w-story h2{font-family:var(--serif);font-size:5cqw;line-height:.9;margin:0 0 2.4cqw;font-weight:500;text-transform:uppercase}.w-story h2 em{color:var(--gold2)}
.w-story p:not(.w-eb){color:#aaa399;line-height:1.8;font-size:max(9px,1.15cqw);margin:0 0 2.4cqw}
.w-looks{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw}
.w-look{position:relative;aspect-ratio:3/4;background:#111;overflow:hidden}.w-look img{width:100%;height:100%;object-fit:cover;object-position:center top}
.w-look:after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#070707)}
.w-look div{position:absolute;z-index:2;left:2cqw;bottom:2cqw;color:#fff}.w-look span{display:block;color:var(--gold2);text-transform:uppercase;font-size:max(7px,.85cqw);letter-spacing:.16em;margin-bottom:.5cqw}.w-look strong{font-family:var(--serif);font-size:max(12px,2.2cqw);font-weight:500}
.w-rev{display:grid;grid-template-columns:.75fr 1.25fr;gap:5cqw;background:#e7ded0;padding:7cqw 5cqw;align-items:center}
.w-q{background:#090909;color:#fff;padding:5cqw 6%}.w-q blockquote{font-family:var(--serif);font-size:max(14px,2.6cqw);line-height:1.15;margin:0 0 2.4cqw}.w-q strong{color:var(--gold2);text-transform:uppercase;font-size:max(8px,.9cqw);letter-spacing:.13em}
.w-news{background:#c39742;display:grid;grid-template-columns:1fr 1.1fr;gap:5cqw;padding:6cqw 6cqw;align-items:center}
.w-news small{display:block;font-size:max(7px,.8cqw);font-weight:800;letter-spacing:.15em;margin:.8cqw 0}
.w-in{display:flex;background:#f7f3e9;height:max(34px,4.6cqw);align-items:center;font-size:max(9px,1.1cqw)}.w-in span{flex:1;padding:0 1.6cqw;color:#999}.w-in b{background:#090909;color:#fff;height:100%;display:flex;align-items:center;padding:0 2cqw;font-size:max(7.5px,.85cqw);letter-spacing:.13em;text-transform:uppercase}
.w-foot{background:#050505;color:#b9b2a7;padding:6cqw 6cqw 3cqw;display:grid;grid-template-columns:1.4fr repeat(var(--cols,3),1fr);grid-auto-flow:column;gap:4cqw}
.w-foot{grid-template-columns:repeat(auto-fit,minmax(90px,1fr));grid-auto-flow:row}
.w-foot>img{width:max(70px,11cqw);object-fit:contain}
.w-foot h4{color:#c99d4b;text-transform:uppercase;font-size:max(7.5px,.85cqw);letter-spacing:.16em;margin:0 0 1.6cqw}
.w-foot a{display:block;font-size:max(9px,1cqw);margin:0 0 1cqw}
.w-copy{grid-column:1/-1;border-top:1px solid #30291f;padding-top:2.4cqw;display:flex;justify-content:space-between;gap:2cqw;flex-wrap:wrap;font-size:max(8px,.9cqw);color:#6f6960}
.pd-sec{margin-top:6px;padding-top:16px;border-top:1px solid var(--line)}
@media(max-width:1100px){.web{grid-template-columns:1fr}.editor{position:static;max-height:none}}
</style>
</head>

function makeOrder(state, when, forceStatus){
  const sellable = state.products.filter(p=>p.status==="active");
  const pool = sellable.length?sellable:state.products;
  const n = Math.random()<.65?1:(Math.random()<.75?2:3);
  const items=[];
  for(let i=0;i<n;i++){ const p=pick(pool); const size=pick(["M","L","L","XL","XL","2XL","S","3XL"]); const ex=items.find(x=>x.pid===p.id&&x.size===size); if(ex) ex.qty++; else items.push({pid:p.id,title:p.title,img:p.img,size,qty:1,price:p.salePrice??p.price}); }
  const subtotal = items.reduce((s,i)=>s+i.price*i.qty,0);
  const activeCodes = state.discounts.filter(x=>x.active && x.type!=="shipping");
  let disc=null, discAmt=0;
  if(activeCodes.length && Math.random()<.35){ disc=pick(activeCodes); discAmt = disc.type==="percent"? subtotal*disc.value/100 : Math.min(disc.value,subtotal); }
  const thr = state.settings.freeShip;
  const shipping = subtotal-discAmt >= thr ? 0 : state.settings.shipRate;
  const tax = +( (subtotal-discAmt)*0.07 ).toFixed(2);
  const fn=pick(FIRST), ln=pick(LAST), c=pick(CITIES);
  const status = forceStatus || "new";
  const o={
    id: state.nextOrder++, created: when, status,
    customer:{name:fn+" "+ln, email:(fn+"."+ln).toLowerCase()+rnd(1,99)+"@gmail.com", phone:"("+rnd(200,989)+") "+rnd(200,989)+"-"+rnd(1000,9999)},
    address:rnd(100,9800)+" "+pick(STREETS)+", "+c[0]+", "+c[1]+" "+rnd(10000,99999),
    items, subtotal, discount:+discAmt.toFixed(2), code: disc?disc.code:null, shipping, tax,
    total:+(subtotal-discAmt+shipping+tax).toFixed(2), payment: pick(["Visa •• "+rnd(1000,9999),"Apple Pay","Mastercard •• "+rnd(1000,9999),"Shop Pay","PayPal","Amex •• "+rnd(1000,9999)]),
    carrier:null, tracking:null, notes:"", log:[{t:when,m:"Order placed"}]
  };
  if(["processing","shipped","delivered"].includes(status)) o.log.push({t:when+3600e3,m:"Payment captured · moved to Processing"});
  if(["shipped","delivered"].includes(status)){ o.carrier=pick(CARRIERS); o.tracking="1Z"+uid().toUpperCase()+rnd(100000,999999); o.log.push({t:when+86400e3,m:"Shipped via "+o.carrier}); }
  if(status==="delivered") o.log.push({t:when+3*86400e3,m:"Delivered"});
  if(status==="cancelled") o.log.push({t:when+7200e3,m:"Order cancelled · refunded"});
  return o;
}

const totalStock = p => SIZES.reduce((s,z)=>s+(+p.stock[z]||0),0);
const isOOS = p => totalStock(p)===0;
const isLow = p => !isOOS(p) && SIZES.some(z=>(+p.stock[z]||0)>0 && (+p.stock[z]) <= S.settings.lowStock) ;
const pById = id => S.products.find(p=>p.id===id);
function statusChip(p){
  if(p.status==="draft") return '<span class="chip c-draft">Draft</span>';
  if(p.status==="soon") return '<span class="chip c-soon">Coming soon</span>';
  if(isOOS(p)) return '<span class="chip c-oos">Out of stock</span>';
  return '<span class="chip c-active">Active</span>';
}
function priceHTML(p){ return p.salePrice!=null && p.salePrice<p.price ? `<span class="price"><s>${money0(p.price)}</s><span class="now">${money0(p.salePrice)}</span></span>` : `<span class="price">${money0(p.price)}</span>`; }
const oChip = s => `<span class="chip c-${s}">${STATUS_LABEL[s]}</span>`;
function toast(html, onclick){
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=html;
  if(onclick) t.onclick=()=>{onclick(); t.remove();};
  $("#toasts").appendChild(t); setTimeout(()=>{t.style.transition=".3s";t.style.opacity=0;setTimeout(()=>t.remove(),300)},4200);
}
function confirmBox(title,msg,okLabel,fn){

  c.classList.add("open"); $("#ov").classList.add("open");

/* ---------- metrics ---------- */
function stats(){
  const now=Date.now(), dayStart=new Date(); dayStart.setHours(0,0,0,0);
  const valid=S.orders.filter(o=>o.status!=="cancelled");
  const today=valid.filter(o=>o.created>=dayStart.getTime());
  const wk=valid.filter(o=>o.created>=now-7*86400e3);
  const prevWk=valid.filter(o=>o.created<now-7*86400e3 && o.created>=now-14*86400e3);
  const rev=a=>a.reduce((s,o)=>s+o.total,0);
  return {today, todayRev:rev(today), wk, wkRev:rev(wk), prevRev:rev(prevWk), aov: valid.length?rev(valid)/valid.length:0, open:S.orders.filter(o=>o.status==="new"||o.status==="processing").length, units:wk.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.qty,0),0)};
}
function revenueChart(){
  const days=14, now=new Date(); now.setHours(0,0,0,0);
  const pts=[]; for(let i=days-1;i>=0;i--){ const st=now.getTime()-i*86400e3, en=st+86400e3; const os=S.orders.filter(o=>o.status!=="cancelled"&&o.created>=st&&o.created<en); pts.push({d:new Date(st),v:os.reduce((s,o)=>s+o.total,0),n:os.length}); }
  const W=700,H=220,pl=46,pr=10,pt=14,pb=28; const max=Math.max(200,...pts.map(p=>p.v))*1.15;
  const x=i=>pl+i*(W-pl-pr)/(days-1), y=v=>pt+(H-pt-pb)*(1-v/max);
  const line=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(p.v).toFixed(1)).join("");
  const area=line+`L${x(days-1)},${H-pb}L${x(0)},${H-pb}Z`;
  let grid=""; for(let g=0;g<=4;g++){ const v=max*g/4; grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(20,18,14,.08)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8a8377">${money0(v)}</text>`; }
  const lbl=pts.map((p,i)=>i%2===0||i===days-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8a8377">${p.d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</text>`:"").join("");
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===days-1?5:3}" fill="${i===days-1?"#bd8a2a":"#11100e"}"><title>${p.d.toDateString()} · ${money(p.v)} · ${p.n} orders</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bd8a2a" stop-opacity=".32"/><stop offset="1" stop-color="#bd8a2a" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#11100e" stroke-width="2"/>${dots}${lbl}</svg>`;
}

function bindOrderRows(){
  document.querySelectorAll("tr.click").forEach(r=>r.onclick=()=>openOrder(+r.dataset.id));

}
function setStatus(id,st,extra){
  const o=S.orders.find(x=>x.id===id); if(!o||o.status===st) return;
  if(st==="shipped"&&!o.tracking){ o.carrier=o.carrier||"UPS"; o.tracking="1Z"+uid().toUpperCase()+rnd(100000,999999); }
  if(st==="cancelled"&&o.status!=="cancelled"){ o.items.forEach(i=>{const p=pById(i.pid); if(p) p.stock[i.size]=(+p.stock[i.size]||0)+i.qty;}); }
  o.status=st; o.log.push({t:Date.now(),m: st==="shipped"?`Shipped via ${o.carrier} · ${o.tracking}`: st==="cancelled"?"Order cancelled · items restocked":"Status changed to "+STATUS_LABEL[st]});
  save(); toast(`Order <b>#${id}</b> → ${STATUS_LABEL[st]}`); if(!extra) render(); else { render(); openOrder(id); }
}
function openOrder(id){

  const d=$("#drawer");
  d.innerHTML=`<div class="dh"><div><p class="eyebrow">${fmtDate(o.created)}</p><h2>Order #${o.id}</h2><div style="margin-top:8px">${oChip(o.status)}</div></div><button class="x" onclick="closeAll()">×</button></div>
  <div class="db">
    ${o.status==="cancelled"?`<div class="box" style="border-color:#e2a9a2;background:#fdf1ef">This order was cancelled and its items were returned to stock.</div>`:`<div class="tl">${flow.map((s,i)=>`<div class="s ${i<=idx?"done":""}"><i>${i<=idx?"✓":i+1}</i>${STATUS_LABEL[s]}</div>`).join("")}</div>`}

      <div style="margin-top:10px"><div class="sum"><span>Subtotal</span><span>${money(o.subtotal)}</span></div>${o.discount?`<div class="sum"><span>Discount (${esc(o.code)})</span><span style="color:var(--red)">−${money(o.discount)}</span></div>`:""}<div class="sum"><span>Shipping</span><span>${o.shipping?money(o.shipping):"Free"}</span></div><div class="sum"><span>Tax</span><span>${money(o.tax)}</span></div><div class="sum t"><span>Total</span><span>${money(o.total)}</span></div><div class="tsub" style="margin-top:4px">Paid with ${esc(o.payment)}</div></div></div>
    <div class="fr"><div class="box"><h4>Customer</h4><div style="font-weight:700">${esc(o.customer.name)}</div><div class="tsub">${esc(o.customer.email)}</div><div class="tsub">${esc(o.customer.phone)}</div></div><div class="box"><h4>Ship to</h4><div style="font-size:13px;line-height:1.5">${esc(o.address)}</div></div></div>
    <div class="box"><h4>Shipping & tracking</h4><div class="fr"><div class="f"><label>Carrier</label><select id="oCar">${["",...CARRIERS].map(c=>`<option ${o.carrier===c?"selected":""}>${c}</option>`).join("")}</select></div><div class="f"><label>Tracking number</label><input id="oTrk" value="${esc(o.tracking||"")}" placeholder="Add tracking #"></div></div>

  </div>
  <div class="df">${o.status!=="cancelled"&&o.status!=="delivered"?`<button class="btn danger" id="oCancel">Cancel order</button>`:""}<span style="flex:1"></span><button class="btn" id="oSave">Save</button>${nextS?`<button class="btn gold" id="oNext">Mark ${STATUS_LABEL[nextS]}</button>`:""}</div>`;
  d.classList.add("open"); $("#ov").classList.add("open");
  const saveFields=()=>{ const c=$("#oCar").value, t=$("#oTrk").value.trim(), n=$("#oNote").value; if(c!==(o.carrier||"")||t!==(o.tracking||"")) o.log.push({t:Date.now(),m:"Tracking updated"+(t?" · "+t:"")}); o.carrier=c||null; o.tracking=t||null; o.notes=n; save(); };
  $("#oSave").onclick=()=>{saveFields();toast(`Order <b>#${o.id}</b> saved`);render();openOrder(o.id);};
  if(nextS) $("#oNext").onclick=()=>{saveFields();setStatus(o.id,nextS,true);};
  if($("#oCancel")) $("#oCancel").onclick=()=>confirmBox("Cancel order #"+o.id+"?","The customer is refunded and the items go back into stock.","Cancel order",()=>setStatus(o.id,"cancelled"));

function toggleOOS(id){
  const p=pById(id);
  if(isOOS(p)){ SIZES.forEach(z=>p.stock[z]=p._lastStock?.[z]??10); delete p._lastStock; toast(`<b>${esc(p.title)}</b> is back in stock`); }
  else { p._lastStock={...p.stock}; SIZES.forEach(z=>p.stock[z]=0); toast(`<b>${esc(p.title)}</b> marked out of stock`); }
  save(); render();
}

function exportData(){
  const out=S.products.map(p=>({id:p.id,slug:p.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),title:p.title,description:p.desc,category:p.category,color:p.color,price:p.price,salePrice:p.salePrice,status:p.status,badge:p.badge,sku:p.sku,stock:p.stock,outOfStock:isOOS(p),edition:p.edition,description:p.description,info:p.info,fit:p.fit,material:p.material,care:p.care,shipping:p.shipping}));
  const json=JSON.stringify({products:out,discounts:S.discounts.map(({id,...d})=>d),settings:S.settings,websiteContent:S.content},null,2);
  const d=$("#drawer");
  d.innerHTML=`<div class="dh"><div><p class="eyebrow">For the website connection</p><h2>Export data</h2></div><button class="x" onclick="closeAll()">×</button></div><div class="db"><p class="muted" style="line-height:1.6">Product, discount, website content and settings data in JSON, ready to wire into the site’s catalog and checkout.</p><textarea class="export" id="exJ" readonly>${esc(json)}</textarea></div><div class="df"><button class="btn gold" id="exC">Copy JSON</button></div>`;
  d.classList.add("open"); $("#ov").classList.add("open");
  $("#exC").onclick=()=>{ try{navigator.clipboard.writeText(json).then(()=>toast("JSON copied"),()=>{$("#exJ").select();toast("Select-all done · press Ctrl/Cmd+C");});}catch(e){$("#exJ").select();} };
}
function manualOrder(){
  const d=$("#drawer"); const ps=S.products.filter(p=>p.status!=="draft");
  d.innerHTML=`<div class="dh"><div><p class="eyebrow">Phone / in-person sale</p><h2>Manual order</h2></div><button class="x" onclick="closeAll()">×</button></div><div class="db">
  <div class="fr"><div class="f"><label>Customer name</label><input id="mN"></div><div class="f"><label>Email</label><input id="mE"></div></div>
  <div class="f"><label>Shipping address</label><input id="mA"></div>
  <div class="fr3"><div class="f"><label>Product</label><select id="mP">${ps.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join("")}</select></div><div class="f"><label>Size</label><select id="mS">${SIZES.map(z=>`<option>${z}</option>`).join("")}</select></div><div class="f"><label>Qty</label><input id="mQ" type="number" min="1" value="1"></div></div>
  <div class="tsub" id="mStock"></div></div><div class="df"><span style="flex:1"></span><button class="btn" onclick="closeAll()">Cancel</button><button class="btn gold" id="mGo">Create order</button></div>`;
  d.classList.add("open"); $("#ov").classList.add("open");
  const sh=()=>{const p=pById(+$("#mP").value); $("#mStock").textContent=p?`${p.stock[$("#mS").value]||0} in stock for size ${$("#mS").value}`:"";}; $("#mP").onchange=sh; $("#mS").onchange=sh; sh();
  $("#mGo").onclick=()=>{ const n=$("#mN").value.trim(); if(!n){$("#mN").style.borderColor="var(--red)";return;}
    const p=pById(+$("#mP").value), z=$("#mS").value, qn=Math.max(1,+$("#mQ").value||1);
    if((+p.stock[z]||0)<qn){ toast(`Only <b>${p.stock[z]||0}</b> left in ${z}`); return; }
    p.stock[z]-=qn; const price=p.salePrice??p.price, sub=price*qn, ship=sub>=S.settings.freeShip?0:S.settings.shipRate, tax=+(sub*.07).toFixed(2);
    const o={id:S.nextOrder++,created:Date.now(),status:"processing",customer:{name:n,email:$("#mE").value||"—",phone:"—"},address:$("#mA").value||"Pickup",items:[{pid:p.id,title:p.title,img:p.img,size:z,qty:qn,price}],subtotal:sub,discount:0,code:null,shipping:ship,tax,total:+(sub+ship+tax).toFixed(2),payment:"Manual",carrier:null,tracking:null,notes:"",log:[{t:Date.now(),m:"Manual order created"}]};
    S.orders.unshift(o); save(); closeAll(); render(); toast(`Order <b>#${o.id}</b> created`); };
}

const getP=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
function setP(o,p,v){ const ks=p.split("."); const last=ks.pop(); const t=ks.reduce((a,k)=>a[k],o); t[last]=v; }
const br=s=>esc(s).replace(/\n/g,"<br>");
function fieldHTML(sec,[key,label,type,maxW]){
  const path=sec+"."+key, v=getP(S.content,path);
  if(type==="text") return `<div class="f"><label>${label}</label><input data-c="${path}" value="${esc(v)}"></div>`;
  if(type==="number") return `<div class="f"><label>${label}</label><input type="number" min="1" max="12" data-c="${path}" data-num="1" value="${esc(v)}"></div>`;
  if(type==="textarea") return `<div class="f"><label>${label}</label><textarea data-c="${path}">${esc(v)}</textarea></div>`;
  if(type==="image") return `<div class="f"><label>${label}</label>${imgPicker(path,v,maxW)}</div>`;
  if(type==="list") return `<div class="f"><label>${label}</label>${v.map((x,i)=>`<div class="lrow"><input data-c="${path}.${i}" value="${esc(x)}"><button class="mini" data-del="${path}" data-i="${i}">×</button></div>`).join("")}<button class="btn sm ghost" data-add="${path}" data-tpl='""'>+ Add item</button></div>`;
  if(type==="links") return `<div class="f"><label>${label}</label>${v.map((x,i)=>`<div class="lrow"><input data-c="${path}.${i}.label" value="${esc(x.label)}" placeholder="Label"><input data-c="${path}.${i}.href" value="${esc(x.href)}" placeholder="Link"><button class="mini" data-del="${path}" data-i="${i}">×</button></div>`).join("")}<button class="btn sm ghost" data-add="${path}" data-tpl='{"label":"New link","href":"#"}'>+ Add link</button></div>`;
  if(type==="cards") return `<div class="f"><label>${label}</label>${v.map((x,i)=>`<div class="subbox"><div class="row" style="justify-content:space-between"><b class="tsub">Card ${i+1}</b><button class="mini" data-del="${path}" data-i="${i}">×</button></div>${imgPicker(path+"."+i+".image",x.image,700)}<input data-c="${path}.${i}.label" value="${esc(x.label)}" placeholder="Label"><input data-c="${path}.${i}.caption" value="${esc(x.caption)}" placeholder="Caption"></div>`).join("")}<button class="btn sm ghost" data-add="${path}" data-tpl='{"image":"","label":"New look","caption":"Caption"}'>+ Add card</button></div>`;
  if(type==="columns") return `<div class="f"><label>${label}</label>${v.map((c,i)=>`<div class="subbox"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><input data-c="${path}.${i}.title" value="${esc(c.title)}" placeholder="Column title" style="font-weight:700"><button class="mini" data-del="${path}" data-i="${i}">×</button></div>${c.links.map((x,j)=>`<div class="lrow"><input data-c="${path}.${i}.links.${j}.label" value="${esc(x.label)}"><input data-c="${path}.${i}.links.${j}.href" value="${esc(x.href)}"><button class="mini" data-del="${path}.${i}.links" data-i="${j}">×</button></div>`).join("")}<button class="btn sm ghost" data-add="${path}.${i}.links" data-tpl='{"label":"New link","href":"#"}'>+ Add link</button></div>`).join("")}<button class="btn sm ghost" data-add="${path}" data-tpl='{"title":"New column","links":[]}'>+ Add column</button></div>`;
}
function imgPicker(path,v,maxW){
  const lib=[HERO,STORY,LOGO,...Object.values(IMG)];
  return `<div class="imgpick"><img src="${v||""}" style="${v?"":"visibility:hidden"}"><div><label class="btn sm" style="cursor:pointer">Upload<input type="file" accept="image/*" hidden data-img="${path}" data-w="${maxW||1000}"></label><div class="lib">${lib.map(s=>`<img src="${s}" data-pick="${path}">`).join("")}</div></div></div>`;
}
VIEWS.website=()=>{

  ed.querySelectorAll("[data-c]").forEach(i=>i.oninput=()=>{ setP(c,i.dataset.c,i.dataset.num?Math.max(1,+i.value||1):i.value); contentChanged(true); });

  ed.querySelectorAll("[data-img]").forEach(inp=>inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; resizeImg(f,+inp.dataset.w,url=>{ setP(c,inp.dataset.img,url); contentChanged(); render(); toast("Image updated"); }); });
  $("#site").querySelectorAll("[data-sec]").forEach(el=>el.onclick=e=>{ e.preventDefault(); openSec=el.dataset.sec; render(); const a=document.querySelector(`.acc[data-sec="${openSec}"]`); if(a) a.scrollIntoView({behavior:"smooth",block:"start"}); });
  $("#wReset").onclick=()=>confirmBox("Reset website content?","All text, links and images go back to the original homepage.","Reset",()=>{ S.content=defaultContent(); save(); render(); toast("Website content reset"); });

let cT=null;
function contentChanged(soft){ save(); const s=$("#saved"); if(s) s.textContent="Saved · not published"; if(soft){ clearTimeout(cT); cT=setTimeout(()=>{ $("#site").innerHTML=siteHTML(); $("#site").querySelectorAll("[data-sec]").forEach(el=>el.onclick=e=>{e.preventDefault(); openSec=el.dataset.sec; render();}); },120); } }
function publishContent(){ S.content.publishedAt=Date.now(); save(); render(); toast("Changes <b>published</b> · they go live on the website once it’s connected"); }
function resizeImg(file,maxW,cb){ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const w=Math.min(maxW,im.width); const cv=document.createElement("canvas"); cv.width=w; cv.height=Math.round(im.height*w/im.width); cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); cb(cv.toDataURL(file.type==="image/png"?"image/png":"image/jpeg",.82)); }; im.src=r.result; }; r.readAsDataURL(file); }

}

/* search */
$("#gsearch").addEventListener("input",e=>{ q=e.target.value.trim().toLowerCase(); if(q&&!["orders","products","discounts","inventory","customers"].includes(page)){ page=/^\d/.test(q)?"orders":"products"; } render(); $("#gsearch").focus(); });

/* boot */
const h=(location.hash||"").slice(1); if(PAGES.some(p=>p[0]===h)) page=h;
render();
setInterval(()=>{ if(page==="overview"&&!$("#drawer").classList.contains("open")) document.querySelectorAll("#feed .it").forEach(el=>{const o=S.orders.find(x=>x.id===+el.dataset.id); if(o) el.querySelector(".tsub").textContent=o.items.reduce((s,i)=>s+i.qty,0)+" item(s) · "+ago(o.created);}); },30000);
</script>
</body>
</html>
